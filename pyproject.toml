[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jevlaya"
version = "0.1.0.dev0"
description = "Open-source decision-intelligence stack for AI agents"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "Holiq Ibrahim" }
]
dependencies = [
    "pydantic>=2.13.5",
    "typing-extensions>=4.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]
laya = [
    "laya>=0.3.11",
]
server = [
    "fastapi>=0.141.1",
    "uvicorn>=0.53.0",
    "httpx>=0.28.1",
]

[project.scripts]
jevlaya = "jevlaya.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jevlaya"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []
